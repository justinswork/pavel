<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cellar &amp; Co.</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="brand">🛒 Cellar &amp; Co.</div>
    </header>

    <main class="layout">
      <section class="catalog">
        <h1>Shop</h1>
        <p class="lede">Add items to your cart. Items marked <span class="pill pill-21">21+</span> need a quick age check at checkout.</p>
        <div id="product-grid" class="product-grid"></div>
      </section>

      <aside class="cart" aria-label="Cart">
        <h2>Cart</h2>
        <div id="cart-items" class="cart-items"></div>
        <div class="cart-footer">
          <div class="cart-total"><span>Total</span><strong id="cart-total">$0.00</strong></div>
          <button id="checkout-btn" class="btn btn-primary" disabled>Checkout</button>
          <button id="clear-btn" class="btn btn-ghost">Clear cart</button>
          <p id="checkout-msg" class="checkout-msg" role="status"></p>
        </div>
      </aside>
    </main>

    <script src="/pavel-client.js"></script>
    <script src="/dev/dev-wallet.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
